# Builds the installable iOS app on EAS whenever main changes.
# Runs on Expo's servers via the GitHub integration — watch it at
# expo.dev → shift-pay → Builds.
name: Build iOS app
on:
  push:
    branches: ['main']
jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production
