# Full iOS build (app + widget extension). Runs on demand only — kick it off
# from expo.dev (Builds → Build from GitHub → main / iOS / production).
#
# Auto-build-on-merge is intentionally off: building needs the one-time
# Apple credentials sign-off first, and until that's done every automatic
# run could only fail. To turn auto-builds back on after credentials exist,
# restore:
#   on:
#     push:
#       branches: ['main']
name: Build iOS app
jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production
